# Databricks Asset Bundles-style learning template. Update compute, policy, and paths for the workspace.
resources:
  jobs:
    retailflow_pipeline:
      name: retailflow-learning-pipeline
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../../notebooks/06_bronze_layer.ipynb
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task:
            notebook_path: ../../notebooks/07_silver_layer.ipynb
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task:
            notebook_path: ../../notebooks/08_gold_layer.ipynb
